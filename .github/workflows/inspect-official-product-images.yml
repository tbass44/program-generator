name: Inspect official catalog product images
on:
  pull_request:
    paths:
      - scripts/inspect_official_catalog.py
      - .github/workflows/inspect-official-product-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 charset-normalizer
      - run: python scripts/inspect_official_catalog.py
      - name: Save inspection results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/official-site-inspection.json
          if ! git diff --cached --quiet; then
            git commit -m "data(mycare): inspect official catalog image candidates"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
