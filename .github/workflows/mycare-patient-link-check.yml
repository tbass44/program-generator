name: MyCare patient linking review

on:
  push:
    branches:
      - feature/mycare-laravel-patient-links
    paths:
      - 'app/api/admin/patients/**/laravel-link/**'
      - 'app/(admin)/admin/patients/[id]/page.tsx'
      - 'components/admin/laravel-patient-link.tsx'
      - 'supabase/migrations/20261122_create_patient_external_ids.sql'
      - '.github/workflows/mycare-patient-link-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install frozen dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
