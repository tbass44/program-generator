name: MyCare reservation handoff typecheck
on:
  push:
    branches:
      - feature/mycare-reservation-handoff
    paths:
      - 'app/api/patient/booking-handoff/route.ts'
      - 'app/api/patient/dashboard/route.ts'
      - 'app/(patient)/dashboard/page.tsx'
      - '.github/workflows/mycare-booking-handoff.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
