name: Replace thumbnails with official product imagery
on:
  pull_request:
    paths:
      - scripts/replace_with_official_thumbnails.py
      - scripts/official-site-inspection.json
      - .github/workflows/replace-with-official-thumbnails.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-product-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13' requests
      - run: python scripts/replace_with_official_thumbnails.py
      - name: Commit actual confirmed official thumbnails
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/product-thumbnails scripts/official-thumbnail-match-report.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(mycare): replace confidently matched product covers with official imagery"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
