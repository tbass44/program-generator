
name: Supabase Keep Alive

on:
  schedule:
    # 日本時間 06:00、14:00、22:00
    - cron: "0 6,14,22 * * *"
      timezone: "Asia/Tokyo"

  # GitHub画面から手動実行できるようにする
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          echo "Checking Supabase connectivity..."

          RESPONSE=$(curl --fail-with-body \
            --silent --show-error \
            --retry 3 \
            --max-time 30 \
            --header "apikey: ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/keep_alive?select=id,message&id=eq.1")

          echo "$RESPONSE" | grep -q '"message":"active"'

          echo "Supabase keep-alive successful"
